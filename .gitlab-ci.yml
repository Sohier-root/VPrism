stages:
  - test
  - build

# Ce runner n'a aucun accès réseau sortant (ni Maven Central, ni le serveur de
# distribution de Maven lui-même) : ni mvn, ni le Maven Wrapper ne peuvent
# fonctionner ici. Les deux jobs ci-dessous compilent et testent en javac/java
# purs, avec uniquement des jars déjà versionnés dans le dépôt (lib/, test-lib/)
# — exactement comme fonctionnait build_exe avant l'introduction de Maven.
# pom.xml reste utile en local (poste de dev avec accès internet, Eclipse/m2e).

test:
  stage: test
  tags:
    - WINDOWS
  script:
    - |
      $env:Path = "$env:JAVA_17_PATH;" + $env:Path
      java -version

      if (Test-Path out) { Remove-Item out -Recurse -Force }
      if (Test-Path test-out) { Remove-Item test-out -Recurse -Force }
      New-Item -ItemType Directory -Force -Path out | Out-Null
      New-Item -ItemType Directory -Force -Path test-out | Out-Null

      $LIBS = Get-ChildItem lib -Filter *.jar -Recurse
      $CP = ($LIBS.FullName -join ";")
      $CONSOLE_JAR = "test-lib\junit-platform-console-standalone-1.10.2.jar"

      $SOURCES = Get-ChildItem src -Filter *.java -Recurse | ForEach-Object { $_.FullName }
      javac -encoding UTF-8 -d out -cp $CP $SOURCES
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      $TEST_SOURCES = Get-ChildItem test -Filter *.java -Recurse | ForEach-Object { $_.FullName }
      javac -encoding UTF-8 -d test-out -cp "out;$CP;$CONSOLE_JAR" $TEST_SOURCES
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      $RUN_CP = "out;test-out;$CP;$CONSOLE_JAR;test\resources"
      java -cp $RUN_CP org.junit.platform.console.ConsoleLauncher execute --scan-classpath test-out --details=tree
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

build_exe:
  stage: build
  tags:
    - WINDOWS
  variables:
    MAIN_CLASS: "com.stilog.prism.Main"
    APP_NAME: "VPrism"
    JAR_NAME: "VPrismJar"
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
      when: on_success
  script:
    - |
      $env:Path = "$env:JAVA_17_PATH;" + $env:Path
      java -version
      if (Test-Path out) { Remove-Item out -Recurse -Force }
      if (Test-Path app_input) { Remove-Item app_input -Recurse -Force }
      New-Item -ItemType Directory -Force -Path out
      New-Item -ItemType Directory -Force -Path app_input
      $LIBS = Get-ChildItem lib -Filter *.jar -Recurse
      $CP = ($LIBS.FullName -join ";") + ";."
      $SOURCES = Get-ChildItem src -Filter *.java -Recurse | ForEach-Object { $_.FullName }
      javac -encoding UTF-8 -d out -cp $CP $SOURCES
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if (Test-Path src) { Copy-Item src\* out -Recurse -Force -Exclude *.java }
      jar cfe "app_input\$($JAR_NAME).jar" $MAIN_CLASS -C out .
      if ($LIBS) { Copy-Item lib\*.jar app_input\ -Force }
      $APP_VERSION = $env:CI_COMMIT_TAG

      jpackage --input app_input --main-jar "$($JAR_NAME).jar" --main-class "$MAIN_CLASS" --name "$APP_NAME" --app-version "$APP_VERSION" --type exe  --dest dist --icon "icon/Icone.ico" --java-options "-Dfile.encoding=UTF-8" --java-options "-Dsun.jnu.encoding=UTF-8" --win-shortcut

      # Renommer le fichier exe généré pour inclure "installer"
      $OLD_EXE = "dist\$($APP_NAME)-$($APP_VERSION).exe"
      $NEW_EXE = "dist\$($APP_NAME)-installer-$($APP_VERSION).exe"
      if (Test-Path $OLD_EXE) {
        Rename-Item -Path $OLD_EXE -NewName "$($APP_NAME)-installer-$($APP_VERSION).exe"
      }

  artifacts:
    paths:
      - "dist/*.exe"
    expire_in: 1 week
