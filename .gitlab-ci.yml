stages:
  - test
  - build
  - release

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: maven-repo
  paths:
    - .m2/repository

test:
  stage: test
  tags:
    - WINDOWS
  script:
    - |
      $env:Path = "$env:JAVA_17_PATH;" + $env:Path
      java -version
      mvn -B test

build_exe:
  stage: build
  tags:
    - WINDOWS
  variables:
    MAIN_CLASS: "com.stilog.prism.Main"
    APP_NAME: "VPrism"
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
      when: on_success
  script:
    - |
      $env:Path = "$env:JAVA_17_PATH;" + $env:Path
      java -version
      if (Test-Path app_input) { Remove-Item app_input -Recurse -Force }
      New-Item -ItemType Directory -Force -Path app_input

      # mvn package (sans -DskipTests) : ne jamais empaqueter un exe depuis du
      # code dont les tests échouent, même si le stage "test" a été sauté.
      mvn -B package

      # Assemble dans app_input/ le jar applicatif + toutes les dépendances
      # runtime résolues par Maven (target/lib/, voir maven-dependency-plugin
      # dans pom.xml — inclut vpi-reader, résolue depuis local-repo/).
      Copy-Item target\*.jar app_input\ -Force
      Copy-Item target\lib\*.jar app_input\ -Force

      $MAIN_JAR = (Get-ChildItem app_input -Filter "vprism-*.jar" | Select-Object -First 1).Name
      $APP_VERSION = $env:CI_COMMIT_TAG

      jpackage --input app_input --main-jar "$MAIN_JAR" --main-class "$MAIN_CLASS" --name "$APP_NAME" --app-version "$APP_VERSION" --type exe  --dest dist --icon "icon/Icone.ico" --java-options "-Dfile.encoding=UTF-8" --java-options "-Dsun.jnu.encoding=UTF-8" --win-shortcut

      # Renommer le fichier exe généré pour inclure "installer"
      $OLD_EXE = "dist\$($APP_NAME)-$($APP_VERSION).exe"
      $NEW_EXE = "dist\$($APP_NAME)-installer-$($APP_VERSION).exe"
      if (Test-Path $OLD_EXE) {
        Rename-Item -Path $OLD_EXE -NewName "$($APP_NAME)-installer-$($APP_VERSION).exe"
      }

  artifacts:
    paths:
      - "dist/*.exe"
    expire_in: 1 week

release:
  variables:
    APP_NAME: "VPrism-release"
  tags:
    - BUILD
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "Version $CI_COMMIT_TAG"
    assets:
      links:
        - name: "${APP_NAME}-${CI_COMMIT_TAG#v}.exe"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/${APP_NAME}-${CI_COMMIT_TAG#v}.exe"
