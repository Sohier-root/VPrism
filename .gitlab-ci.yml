stages:
  - build
  - release

variables:
  APP_NAME: "VPCompare"

build_exe:
  stage: build
  image: eclipse-temurin:20
  tags:
    - BUILD
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # Extraire la version depuis le tag (v1.0.0 → 1.0.0)
    - VERSION=${CI_COMMIT_TAG}

    - java -version

    # Build JAR
    - cmd /c mvnw.cmd clean package

    # Génération EXE
    - jpackage
        --input target/
        --name ${APP_NAME}-${VERSION}
        --main-jar monapp.jar
        --type exe

  artifacts:
    paths:
      - "${APP_NAME}-*.exe"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "Version $CI_COMMIT_TAG"
    assets:
      links:
        - name: "${APP_NAME}-${CI_COMMIT_TAG#v}.exe"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/${APP_NAME}-${CI_COMMIT_TAG#v}.exe"
