stages:
  - build
  - release

variables:
  APP_NAME: "VPCompare"

build_exe:
  stage: build
  tags:
    - WINDOWS
  variables:
    MAIN_CLASS: "com.myapp.Main"
  script:
    - |
      # 1. Nettoyage et préparation
      if (Test-Path out) { Remove-Item out -Recurse -Force }
      if (Test-Path dist) { Remove-Item dist -Recurse -Force }
      New-Item -ItemType Directory -Force -Path out
      
      # 2. Construction du Classpath pour la compilation
      $CP = "."
      if (Test-Path lib) {
          $libs = (Get-ChildItem lib -Filter *.jar -Recurse | ForEach-Object { $_.FullName })
          if ($libs) { $CP = ($libs -join ";") + ";." }
      }
      
      # 3. Compilation
      $SOURCES = Get-ChildItem src -Filter *.java -Recurse | ForEach-Object { $_.FullName }
      javac -d out -cp "$CP" $SOURCES

      # 4. Ressources et dépendances
      # On copie les ressources dans 'out'
      if (Test-Path src) { Copy-Item src\* out -Recurse -Force -Exclude *.java }
      # On s'assure que les JAR externes sont dans le même dossier pour jpackage
      if (Test-Path lib) { Copy-Item lib\* . -Recurse -Force }

      # 5. Création du JAR principal
      jar cfe "$($env:APP_NAME).jar" $env:MAIN_CLASS -C out .

      # 6. Création de l'EXE
      jpackage `
        --input . `
        --main-jar "$($env:APP_NAME).jar" `
        --name "$env:APP_NAME" `
        --type exe `
        --dest dist 

  artifacts:
    paths:
      - "dist/*.exe"
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "Version $CI_COMMIT_TAG"
    assets:
      links:
        - name: "${APP_NAME}-${CI_COMMIT_TAG#v}.exe"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/${APP_NAME}-${CI_COMMIT_TAG#v}.exe"
