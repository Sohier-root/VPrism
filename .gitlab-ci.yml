stages:
  - build
  - release

variables:
  APP_NAME: "VPCompare"

build_exe:
  stage: build
  tags:
    - WINDOWS
  variables:
    MAIN_CLASS: "com.stilog.analysevpi.Main"
    APP_NAME: "VPCompare"
    JAR_NAME: "VPCompareJar"
  script:
    - |
      $env:Path = "$env:JAVA_17_PATH;" + $env:Path
      java -version
      if (Test-Path out) { Remove-Item out -Recurse -Force }
      if (Test-Path app_input) { Remove-Item app_input -Recurse -Force }
      New-Item -ItemType Directory -Force -Path out
      New-Item -ItemType Directory -Force -Path app_input
      $LIBS = Get-ChildItem lib -Filter *.jar -Recurse
      $CP = ($LIBS.FullName -join ";") + ";."
      $SOURCES = Get-ChildItem src -Filter *.java -Recurse | ForEach-Object { $_.FullName }
      javac -encoding UTF-8 -d out -cp $CP $SOURCES
      if (Test-Path src) { Copy-Item src\* out -Recurse -Force -Exclude *.java }
      jar cfe "app_input\$($JAR_NAME).jar" $MAIN_CLASS -C out .
      if ($LIBS) { Copy-Item lib\*.jar app_input\ -Force }
      jpackage --input app_input --main-jar "$($JAR_NAME).jar" --main-class "$MAIN_CLASS" --name "$APP_NAME" --type exe  --dest dist --java-options "-Dfile.encoding=UTF-8" --java-options "-Dsun.jnu.encoding=UTF-8" --win-shortcut


  artifacts:
    paths:
      - "dist/*.exe"
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "Version $CI_COMMIT_TAG"
    assets:
      links:
        - name: "${APP_NAME}-${CI_COMMIT_TAG#v}.exe"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/${APP_NAME}-${CI_COMMIT_TAG#v}.exe"
